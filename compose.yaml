services:
  postgresql:
    image: localhost/postgresql-lakekeeper-ubi:development
    environment:
      POSTGRES_DB: lakekeeper
      POSTGRESQL_TLS_CERT_FILE: /run/tls/server.crt
      POSTGRESQL_TLS_KEY_FILE: /run/tls/server.key
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - source: postgres-password
        target: postgres-password
        mode: 0440
    ports:
      - "127.0.0.1:5432:5432"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - postgres-data:/var/lib/pgsql
      - ${POSTGRES_TLS_CERT_FILE:?supply the postgres certificate}:/run/tls/server.crt:ro
      - ${POSTGRES_TLS_KEY_FILE:?supply the postgres private key}:/run/tls/server.key:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_signal: SIGINT

secrets:
  postgres-password:
    environment: POSTGRES_PASSWORD

volumes:
  postgres-data:
